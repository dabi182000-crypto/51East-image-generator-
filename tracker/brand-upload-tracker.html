<title>Brand Upload Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#f1f4f3; --surface:#ffffff; --surface-2:#e9efed; --sunk:#e4ebe9;
  --line:#d8e1de; --line-soft:#e7ede9;
  --ink:#0e1c19; --body:#3a4a47; --muted:#6c7f7b; --faint:#93a5a1;
  --accent:#0d7361; --accent-wash:#e2f0ec; --on-accent:#ffffff;
  --st-starting:#5f7387; --st-progress:#a86e14; --st-uploaded:#25813f;
  --good:#25813f;
  --shadow-1:0 1px 2px rgba(12,30,26,.07);
  --shadow-2:0 10px 30px -14px rgba(12,30,26,.35);
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0b1211; --surface:#121b1a; --surface-2:#182322; --sunk:#0e1716;
    --line:#25332f; --line-soft:#1d2a28;
    --ink:#e8f0ee; --body:#bfcecb; --muted:#8ba09c; --faint:#6a7d7a;
    --accent:#3fcfb2; --accent-wash:#12302a; --on-accent:#06231e;
    --st-starting:#8ea3b8; --st-progress:#d7a23f; --st-uploaded:#5cc077;
    --good:#5cc077;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 10px 30px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0b1211; --surface:#121b1a; --surface-2:#182322; --sunk:#0e1716;
  --line:#25332f; --line-soft:#1d2a28;
  --ink:#e8f0ee; --body:#bfcecb; --muted:#8ba09c; --faint:#6a7d7a;
  --accent:#3fcfb2; --accent-wash:#12302a; --on-accent:#06231e;
  --st-starting:#8ea3b8; --st-progress:#d7a23f; --st-uploaded:#5cc077;
  --good:#5cc077;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 10px 30px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--body);
  font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  font-size:15.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1{margin:0; color:var(--ink); font-family:Archivo,"Arial Narrow",system-ui,sans-serif}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums}

.wrap{max-width:880px; margin:0 auto; padding:28px 20px 70px}

/* header */
.top{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:20px}
.top h1{font-variation-settings:"wdth" 118,"wght" 800; font-size:24px; text-transform:uppercase; margin-right:auto}
.synced{
  display:inline-flex; align-items:center; gap:7px; padding:5px 12px 5px 9px;
  border:1px solid var(--line); border-radius:999px; background:var(--surface); font-size:12.5px; color:var(--muted);
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.synced.on{color:var(--body)}
.synced.on .dot{background:var(--good); box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 22%,transparent)}

/* add bar */
.addbar{display:flex; gap:9px; margin-bottom:16px}
.addbar input{
  flex:1; height:46px; padding:0 16px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--surface); font-size:15.5px;
}
.addbar input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-wash)}
.addbtn{
  height:46px; padding:0 20px; border:0; border-radius:var(--r); background:var(--accent); color:var(--on-accent);
  font-size:15px; font-weight:700;
}
.addbtn:hover{filter:brightness(1.06)}
.hint{font-size:12.5px; color:var(--faint); margin:-9px 0 18px 2px}

/* stats */
.stats{display:flex; gap:9px; flex-wrap:wrap; margin-bottom:20px}
.stat{
  flex:1 1 130px; padding:11px 15px; border-radius:var(--r); background:var(--surface); border:1px solid var(--line);
}
.stat .n{font-family:Archivo,system-ui; font-variation-settings:"wdth" 108,"wght" 800; font-size:21px; color:var(--sc,var(--ink)); line-height:1}
.stat .k{font-size:11.5px; color:var(--muted); margin-top:3px; text-transform:uppercase; letter-spacing:.08em; font-weight:600}

/* notice */
.notice{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 16px; border-radius:var(--r);
  background:var(--accent-wash); border:1px solid color-mix(in srgb,var(--accent) 34%,transparent);
  color:var(--ink); font-size:14px; margin-bottom:18px;
}
.notice .grow{flex:1 1 240px}
.notice button{
  height:34px; padding:0 14px; border:1px solid transparent; border-radius:9px; background:var(--accent);
  color:var(--on-accent); font-size:13.5px; font-weight:700;
}

/* list */
.list{display:flex; flex-direction:column; gap:8px}
.row{
  display:grid; align-items:center; gap:12px;
  grid-template-columns:4px 1fr auto auto auto;
  padding:12px 14px; border-radius:var(--r); background:var(--surface); border:1px solid var(--line);
  box-shadow:var(--shadow-1);
}
.stripe{width:4px; align-self:stretch; border-radius:2px; background:var(--sc)}
.namecol{display:flex; flex-direction:column; gap:0; min-width:0}
.nameinput{
  border:1px solid transparent; background:transparent; padding:6px 8px 2px; border-radius:8px;
  font-size:15.5px; font-weight:600; color:var(--ink); min-width:0; width:100%;
}
.nameinput:hover{background:var(--surface-2)}
.nameinput:focus{outline:none; border-color:var(--accent); background:var(--surface); box-shadow:0 0 0 3px var(--accent-wash)}
.byline{display:flex; align-items:center; gap:3px; padding-left:8px}
.bylabel{font-size:11.5px; color:var(--faint); flex:none}
.byinput{
  flex:1 1 40px; min-width:24px; border:1px solid transparent; background:transparent; padding:1px 6px; border-radius:6px;
  font-size:11.5px; color:var(--muted); font-style:italic;
}
.byinput::placeholder{color:var(--faint)}
.byinput:hover{background:var(--surface-2)}
.byinput:focus{outline:none; border-color:var(--accent); background:var(--surface); box-shadow:0 0 0 2px var(--accent-wash); font-style:normal}
.seasoninput{
  flex:none; width:64px; text-align:center; border:1px solid var(--line); background:var(--surface-2); border-radius:999px;
  font-size:10.5px; font-weight:700; color:var(--muted); padding:2px 6px; margin-left:2px; letter-spacing:.01em;
}
.seasoninput::placeholder{color:var(--faint); font-weight:600}
.seasoninput:hover{border-color:var(--muted); color:var(--ink)}
.seasoninput:focus{outline:none; border-color:var(--accent); background:var(--surface); box-shadow:0 0 0 2px var(--accent-wash); color:var(--ink)}

.seg{display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; flex:none}
.seg button{
  padding:8px 13px; border:0; background:var(--surface); color:var(--muted); font-size:12.5px; font-weight:600;
  border-right:1px solid var(--line); white-space:nowrap;
}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--sc); color:#fff}
:root[data-theme="dark"] .seg button.on,
:root:not([data-theme="light"]) .seg button.on{color:#07130f}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .seg button.on{color:#fff}}
.seg button:hover:not(.on){background:var(--surface-2); color:var(--ink)}

.progwrap{display:flex; align-items:center; gap:9px; flex:none}
.bar{width:96px; height:8px; border-radius:5px; background:var(--sunk); overflow:hidden; flex:none}
.bar>i{display:block; height:100%; border-radius:5px; background:var(--sc)}
.pctinput{
  width:54px; height:30px; padding:0 6px; text-align:right; border:1px solid var(--line); border-radius:7px;
  background:var(--surface); font-weight:700; color:var(--sc); font-size:14.5px;
}
.pctinput:focus{outline:none; border-color:var(--accent)}
.pct-suffix{color:var(--muted); font-size:13px; margin-left:-4px}

.delbtn{
  width:32px; height:32px; border:1px solid var(--line); border-radius:8px; background:var(--surface);
  color:var(--faint); font-size:15px; flex:none; display:grid; place-items:center;
}
.delbtn:hover{color:#fff; background:#c0413d; border-color:#c0413d}
.delbtn.confirm{color:#fff; background:#c0413d; border-color:#c0413d; font-size:11px; font-weight:700; width:auto; padding:0 10px}

.empty{
  text-align:center; padding:50px 20px; border:1px dashed var(--line); border-radius:var(--r); background:var(--surface);
  color:var(--muted); font-size:14.5px;
}

@media (max-width:640px){
  .row{grid-template-columns:4px 1fr; grid-template-areas:"stripe name" "stripe seg" "stripe prog"; row-gap:10px}
  .stripe{grid-area:stripe}
  .namecol{grid-area:name}
  .nameinput{font-size:16px}
  .seg{grid-area:seg; width:100%}
  .seg button{flex:1; text-align:center}
  .progwrap{grid-area:prog; justify-content:space-between; width:100%}
  .bar{flex:1; width:auto}
  .top h1{font-size:19px}
}
</style>

<datalist id="seasonList">
  <option value="SS25"><option value="SS26"><option value="FW25"><option value="FW26">
  <option value="Resort"><option value="Pre-Fall"><option value="Holiday"><option value="Year-round">
</datalist>

<div class="wrap">
  <div class="top">
    <h1>Brand Upload Desk</h1>
    <div class="synced" id="synced"><i class="dot"></i><span id="syncedTxt">Connecting…</span></div>
  </div>

  <div class="addbar">
    <input id="addInput" type="text" placeholder="Type a brand name and press Enter…" aria-label="New brand name">
    <button class="addbtn" id="addBtn">+ Add</button>
  </div>
  <div class="hint">Paste a list of names (one per line) to add several at once.</div>

  <div class="notice" id="notice" hidden></div>
  <section class="stats" id="stats"></section>
  <section class="list" id="list"></section>
</div>

<script>
(function(){
"use strict";

var STAGES = [
  {id:"starting", label:"Starting",    v:"--st-starting"},
  {id:"progress", label:"In progress", v:"--st-progress"},
  {id:"uploaded", label:"Uploaded",    v:"--st-uploaded"}
];
var STAGE={}; STAGES.forEach(function(s){ STAGE[s.id]=s; });

var SAMPLES=[
  {name:"Aurora Home",   by:"Mahmoud", season:"FW25", stage:"starting", percent:10},
  {name:"Nordvik Denim", by:"Sara",    season:"SS26", stage:"progress", percent:55},
  {name:"Casa Verde Ceramics", by:"Mahmoud", season:"Year-round", stage:"progress", percent:80},
  {name:"Marisol Swim",  by:"Omar",    season:"SS26", stage:"uploaded", percent:100}
];

var db=null;
var state={ brands:[], started:false };
var armedDelete=null, armedTimer=null;
function disarmDelete(){
  if(armedTimer){ clearTimeout(armedTimer); armedTimer=null; }
  if(armedDelete){ armedDelete=null; render(); }
}

function $(s){ return document.querySelector(s); }
function esc(v){ return String(v==null?"":v).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function clampPct(v){ v=Math.round(Number(v)||0); return Math.max(0,Math.min(100,v)); }

function inSample(){ return !state.brands.length && !state.started; }
function rows(){
  if(inSample()) return SAMPLES.map(function(s,i){ return Object.assign({id:"sample"+i,_sample:true}, s); });
  return state.brands.slice().sort(function(a,b){
    var oa=STAGES.findIndex(function(s){return s.id===a.stage;}), ob=STAGES.findIndex(function(s){return s.id===b.stage;});
    return oa-ob || String(a.name).localeCompare(String(b.name));
  });
}

function patch(id, changes){
  var b=null; state.brands.forEach(function(x){ if(x.id===id) b=x; });
  if(!b || !db) return;
  db.doc("brands/"+id).update(changes)["catch"](function(){ toast("Couldn't save that — try again."); });
}
function toast(msg){
  var o=$(".toast"); if(o) o.remove();
  var t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  t.style.cssText="position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:999px;font-size:13.5px;box-shadow:var(--shadow-2)";
  document.body.appendChild(t); setTimeout(function(){ if(t.parentNode) t.remove(); },2400);
}

function render(){
  renderNotice();
  renderStats();
  renderList();
}

function renderNotice(){
  var el=$("#notice");
  if(inSample()){
    el.hidden=false;
    el.innerHTML='<span class="grow"><b>These four brands are just an example.</b> Nothing here is saved yet.</span>'+
      '<button id="clearSample">Clear them and start ours</button>';
    return;
  }
  if(!db){
    el.hidden=false;
    el.innerHTML='<span class="grow">Not connected — open this page from its Claude link so changes are saved and shared.</span>';
    return;
  }
  el.hidden=true; el.innerHTML="";
}

function renderStats(){
  var list=rows();
  var counts={starting:0,progress:0,uploaded:0}, sum=0;
  list.forEach(function(b){ counts[b.stage]=(counts[b.stage]||0)+1; sum+=clampPct(b.percent); });
  var avg=list.length?Math.round(sum/list.length):0;
  $("#stats").innerHTML =
    STAGES.map(function(s){
      return '<div class="stat" style="--sc:var('+s.v+')"><div class="n">'+(counts[s.id]||0)+'</div><div class="k">'+esc(s.label)+'</div></div>';
    }).join("") +
    '<div class="stat"><div class="n">'+avg+'%</div><div class="k">Average done</div></div>';
}

function renderList(){
  var list=rows();
  if(!list.length){
    $("#list").innerHTML='<div class="empty">No brands yet. Add one above to get started.</div>';
    return;
  }
  $("#list").innerHTML = list.map(rowHtml).join("");
}

function rowHtml(b){
  var s=STAGE[b.stage]||STAGE.starting, p=clampPct(b.percent), ro=!!b._sample;
  return '<div class="row" data-id="'+esc(b.id)+'" style="--sc:var('+s.v+')">'+
    '<div class="stripe"></div>'+
    '<div class="namecol">'+
      '<input class="nameinput" data-name="'+esc(b.id)+'" value="'+esc(b.name)+'" '+(ro?"disabled":"")+' aria-label="Brand name">'+
      '<div class="byline"><span class="bylabel">by</span><input class="byinput" data-by="'+esc(b.id)+'" value="'+esc(b.by||"")+'" placeholder="name" '+(ro?"disabled":"")+' aria-label="Added by">'+
        '<input class="seasoninput" list="seasonList" data-season="'+esc(b.id)+'" value="'+esc(b.season||"")+'" placeholder="season" '+(ro?"disabled":"")+' aria-label="Season"></div>'+
    '</div>'+
    '<div class="seg" role="group" aria-label="Stage">'+
      STAGES.map(function(x){
        return '<button type="button" data-stage="'+esc(b.id)+'" data-val="'+x.id+'" class="'+(x.id===b.stage?"on":"")+'" '+(ro?"disabled":"")+'>'+esc(x.label)+'</button>';
      }).join("")+
    '</div>'+
    '<div class="progwrap"><div class="bar"><i style="width:'+p+'%"></i></div>'+
      '<input class="pctinput mono" type="number" min="0" max="100" value="'+p+'" data-pct="'+esc(b.id)+'" '+(ro?"disabled":"")+' aria-label="Percent done"><span class="pct-suffix">%</span></div>'+
    (b.id===armedDelete
      ? '<button class="delbtn confirm" data-del="'+esc(b.id)+'" aria-label="Confirm remove '+esc(b.name)+'" title="Click again to remove">Sure?</button>'
      : '<button class="delbtn" data-del="'+esc(b.id)+'" '+(ro?"disabled":"")+' aria-label="Remove '+esc(b.name)+'" title="Remove">✕</button>')+
  '</div>';
}

/* ---- add ---- */
function addBrands(text){
  var names = String(text||"").split(/\r?\n/).map(function(s){ return s.trim(); }).filter(Boolean);
  if(!names.length) return;
  if(!db){ toast("Not connected — nothing was saved."); return; }
  var chain=Promise.resolve();
  names.forEach(function(name){
    chain=chain.then(function(){
      return db.collection("brands").add({name:name, stage:"starting", percent:0, createdAt:Date.now()})
        ["catch"](function(){ toast("Couldn't add “"+name+"”."); });
    });
  });
  chain.then(function(){
    state.started=true;
    db.doc("meta/config").set({started:true})["catch"](function(){});
  });
}

/* ---- events ---- */
$("#addBtn").addEventListener("click", function(){
  addBrands($("#addInput").value);
  $("#addInput").value=""; $("#addInput").focus();
});
$("#addInput").addEventListener("keydown", function(e){
  if(e.key==="Enter"){ addBrands(this.value); this.value=""; }
});
$("#addInput").addEventListener("paste", function(e){
  var text=(e.clipboardData||window.clipboardData).getData("text");
  if(text && text.indexOf("\n")>=0){
    e.preventDefault();
    addBrands(text);
    this.value="";
  }
});

document.addEventListener("click", function(e){
  var el;
  if(e.target.id==="clearSample"){
    state.started=true;
    if(db) db.doc("meta/config").set({started:true})["catch"](function(){});
    render();
    $("#addInput").focus();
    return;
  }
  if((el=e.target.closest("[data-stage]"))){
    var id=el.getAttribute("data-stage"), val=el.getAttribute("data-val");
    var changes={stage:val};
    if(val==="uploaded") changes.percent=100;
    patch(id, changes);
    return;
  }
  if((el=e.target.closest("[data-del]"))){
    var did=el.getAttribute("data-del");
    var b=null; state.brands.forEach(function(x){ if(x.id===did) b=x; });
    if(!b || !db) return;
    if(armedDelete!==did){
      armedDelete=did;
      if(armedTimer) clearTimeout(armedTimer);
      armedTimer=setTimeout(disarmDelete, 2800);
      render();
      return;
    }
    if(armedTimer) clearTimeout(armedTimer);
    armedDelete=null;
    db.doc("brands/"+did)["delete"]().then(function(){ toast("Removed."); })["catch"](function(){ toast("Couldn't remove that."); });
    return;
  }
  if(armedDelete && !e.target.closest('[data-del="'+armedDelete+'"]')) disarmDelete();
});

document.addEventListener("input", function(e){
  var t=e.target, id;
  if((id=t.getAttribute&&t.getAttribute("data-pct"))){
    var v=clampPct(t.value);
    var row=t.closest(".row"); if(row) row.querySelector(".bar>i").style.width=v+"%";
  }
});
document.addEventListener("change", function(e){
  var t=e.target, id;
  if((id=t.getAttribute&&t.getAttribute("data-pct"))){ patch(id,{percent:clampPct(t.value)}); }
});
document.addEventListener("blur", function(e){
  var t=e.target, id;
  if((id=t.getAttribute&&t.getAttribute("data-name"))){
    var name=t.value.trim();
    if(name) patch(id,{name:name}); else t.value = (function(){ var b=null; state.brands.forEach(function(x){if(x.id===id)b=x;}); return b?b.name:""; })();
  }
  if((id=t.getAttribute&&t.getAttribute("data-by"))){
    patch(id,{by:t.value.trim()});
  }
  if((id=t.getAttribute&&t.getAttribute("data-season"))){
    patch(id,{season:t.value.trim()});
  }
}, true);
document.addEventListener("keydown", function(e){
  if(e.key==="Enter" && e.target.matches("[data-name],[data-pct],[data-by],[data-season]")) e.target.blur();
});

/* ---- boot ---- */
render();

if(window.claude && typeof window.claude.use==="function"){
  window.claude.use("db").then(function(x){
    db=x;
    var pill=$("#synced"), txt=$("#syncedTxt");
    if(!db){ pill.classList.remove("on"); txt.textContent="Not connected"; render(); return; }
    db.collection("brands").onSnapshot(function(snap){
      state.brands = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      pill.classList.add("on"); txt.textContent="Saved automatically";
      render();
    }, function(){ pill.classList.remove("on"); txt.textContent="Sync error"; });
    db.doc("meta/config").onSnapshot(function(d){
      state.started = d.exists && !!d.data().started;
      render();
    }, function(){});
  })["catch"](function(){
    $("#syncedTxt").textContent="Not connected"; render();
  });
} else {
  $("#syncedTxt").textContent="Not connected";
}
})();
</script>
