<title>Brand Upload Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#f1f4f3; --surface:#ffffff; --surface-2:#e9efed; --sunk:#e4ebe9;
  --line:#d6e0dd; --line-soft:#e6ecea;
  --ink:#0e1c19; --body:#3a4a47; --muted:#6c7f7b; --faint:#93a5a1;
  --accent:#0d7361; --accent-ink:#0a5a4c; --accent-wash:#e2f0ec;
  --st-intake:#5f7387; --st-sheet:#4a55c8; --st-images:#7a52cc;
  --st-ready:#1a76ad; --st-uploading:#a86e14; --st-qc:#a3376f;
  --st-live:#25813f; --st-blocked:#c03a37;
  --danger:#c03a37; --warn:#a86e14; --good:#25813f;
  --on-accent:#ffffff;
  --shadow-1:0 1px 2px rgba(12,30,26,.07);
  --shadow-2:0 2px 6px rgba(12,30,26,.07), 0 18px 40px -22px rgba(12,30,26,.35);
  --r:8px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0b1211; --surface:#121b1a; --surface-2:#182322; --sunk:#0e1716;
    --line:#25332f; --line-soft:#1d2a28;
    --ink:#e8f0ee; --body:#bfcecb; --muted:#8ba09c; --faint:#6a7d7a;
    --accent:#3fcfb2; --accent-ink:#7fe3ce; --accent-wash:#12302a;
    --st-intake:#8ea3b8; --st-sheet:#8a92f0; --st-images:#b18ef0;
    --st-ready:#54abdd; --st-uploading:#d7a23f; --st-qc:#e07bae;
    --st-live:#5cc077; --st-blocked:#f0736f;
    --danger:#f0736f; --warn:#d7a23f; --good:#5cc077;
    --on-accent:#06231e;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 2px 6px rgba(0,0,0,.4), 0 18px 40px -22px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0b1211; --surface:#121b1a; --surface-2:#182322; --sunk:#0e1716;
  --line:#25332f; --line-soft:#1d2a28;
  --ink:#e8f0ee; --body:#bfcecb; --muted:#8ba09c; --faint:#6a7d7a;
  --accent:#3fcfb2; --accent-ink:#7fe3ce; --accent-wash:#12302a;
  --st-intake:#8ea3b8; --st-sheet:#8a92f0; --st-images:#b18ef0;
  --st-ready:#54abdd; --st-uploading:#d7a23f; --st-qc:#e07bae;
  --st-live:#5cc077; --st-blocked:#f0736f;
  --danger:#f0736f; --warn:#d7a23f; --good:#5cc077;
  --on-accent:#06231e;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 6px rgba(0,0,0,.4), 0 18px 40px -22px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--body);
  font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  font-size:14.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; color:var(--ink); font-family:Archivo,"Arial Narrow",system-ui,sans-serif; text-wrap:balance}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums}
.lbl{
  font-family:Archivo,system-ui,sans-serif; font-variation-settings:"wdth" 100;
  font-size:10.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--muted);
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40; background:var(--surface);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  padding:11px 20px;
}
.mark{display:flex; align-items:baseline; gap:10px; margin-right:auto}
.mark h1{
  font-variation-settings:"wdth" 122,"wght" 800; font-size:19px; letter-spacing:-.005em;
  line-height:1; text-transform:uppercase;
}
.mark .store{font-size:12.5px; color:var(--muted); border-left:1px solid var(--line); padding-left:10px}
.livepill{
  display:inline-flex; align-items:center; gap:7px; padding:4px 10px 4px 8px;
  border:1px solid var(--line); border-radius:999px; background:var(--surface-2); font-size:12px; color:var(--muted);
}
.livedot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.livepill.on .livedot{background:var(--good); box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 22%,transparent)}
.livepill.on{color:var(--body)}
.faces{display:flex; align-items:center}
.face{
  width:27px;height:27px;border-radius:50%;display:grid;place-items:center;
  font-size:10.5px;font-weight:700;color:#fff;border:2px solid var(--surface);margin-left:-7px;
  font-family:"IBM Plex Mono",monospace; letter-spacing:.02em;
}
.face:first-child{margin-left:0}
.face.ghost{background:var(--faint)}
.whoami{
  display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--line);
  border-radius:var(--r); background:var(--surface); font-size:13px;
}
.whoami b{color:var(--ink);font-weight:600}
.iconbtn{
  width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:var(--r);background:var(--surface);color:var(--muted);
}
.iconbtn:hover{color:var(--ink);border-color:var(--muted)}

/* ---------- banner ---------- */
.banner{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  margin:14px 20px 0; padding:11px 14px; border-radius:var(--r);
  background:var(--accent-wash); border:1px solid color-mix(in srgb,var(--accent) 34%,transparent);
  color:var(--accent-ink); font-size:13.5px;
}
.banner .grow{flex:1 1 260px}
.banner b{font-weight:700}

/* ---------- stats ---------- */
.stats{
  display:flex; gap:0; flex-wrap:wrap; margin:14px 20px 0;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden;
}
.stat{flex:1 1 150px; padding:11px 16px; border-right:1px solid var(--line-soft); min-width:0}
.stat:last-child{border-right:0}
.stat .v{
  font-family:Archivo,system-ui,sans-serif; font-variation-settings:"wdth" 108,"wght" 700;
  font-size:23px; line-height:1.15; color:var(--ink); font-variant-numeric:tabular-nums;
}
.stat .v small{font-size:13px;color:var(--muted);font-weight:500}
.stat .k{margin-top:1px}
.stat.alarm .v{color:var(--danger)}
.stat.warnish .v{color:var(--warn)}
.bar{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:7px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .35s ease}

/* ---------- stage strip ---------- */
.strip{
  display:flex; flex-wrap:wrap; gap:7px; margin:14px 20px 0; padding-bottom:3px;
}
.stagechip{
  flex:none; display:flex; align-items:center; gap:9px; padding:7px 12px 7px 9px;
  border:1px solid var(--line); border-radius:var(--r); background:var(--surface);
  text-align:left; transition:border-color .15s,background .15s;
}
.stagechip:hover{border-color:var(--muted)}
.stagechip[aria-pressed="true"]{border-color:var(--ink); background:var(--surface-2)}
.stagechip .num{
  font-family:Archivo,system-ui,sans-serif; font-variation-settings:"wdth" 70,"wght" 700;
  font-size:15px; color:var(--sc); line-height:1;
}
.stagechip .nm{font-size:13px;color:var(--body);white-space:nowrap;line-height:1.15}
.stagechip .ct{
  font-family:"IBM Plex Mono",monospace; font-size:12.5px; font-weight:600; color:var(--ink);
  font-variant-numeric:tabular-nums; padding-left:9px; border-left:1px solid var(--line-soft);
}
.stagechip .swatch{width:3px;align-self:stretch;border-radius:2px;background:var(--sc)}

/* ---------- toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:14px 20px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{
  padding:6px 13px;background:transparent;border:0;border-right:1px solid var(--line-soft);
  font-size:13px;color:var(--muted);
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground);font-weight:600}
.field{
  display:flex;align-items:center;gap:7px;padding:0 10px;height:32px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
}
.field input,.field select{border:0;background:transparent;outline:none;font-size:13px;min-width:0}
.field input{width:180px}
.spacer{flex:1}
.btn{
  height:32px;padding:0 13px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface);font-size:13px;color:var(--body);display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{border-color:var(--muted);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.06);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- table ---------- */
main{padding:14px 20px 60px}
.tablewrap{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow-x:auto}
.grid{min-width:940px}
.row{
  display:grid;
  grid-template-columns:4px minmax(200px,2fr) 168px 150px minmax(180px,1.2fr) 104px 96px;
  align-items:center; gap:0;
}
.head{border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0}
.head>div{padding:8px 12px}
.head>div:first-child{padding:0}
.rw{border-bottom:1px solid var(--line-soft);background:transparent;text-align:left;width:100%;border-left:0;border-right:0;border-top:0;padding:0;font:inherit;color:inherit}
.rw:last-child{border-bottom:0}
.rw:hover{background:var(--surface-2)}
.rw[aria-current="true"]{background:var(--accent-wash)}
.rw>div{padding:10px 12px;min-width:0}
.rw>.stripe{padding:0;align-self:stretch;background:var(--sc)}
.bname{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bmeta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-top:1px}
.code{font-size:11px;letter-spacing:.06em;color:var(--faint)}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
  font-size:12px;font-weight:600;white-space:nowrap;
  color:var(--sc); background:color-mix(in srgb,var(--sc) 13%,transparent);
  border:1px solid color-mix(in srgb,var(--sc) 30%,transparent);
}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--sc);flex:none}
.owner{display:flex;align-items:center;gap:8px;min-width:0}
.owner .face{margin:0;width:24px;height:24px;border-width:0;font-size:9.5px}
.owner span{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.owner.none{color:var(--faint);font-style:italic;font-size:13px}
.prog .nums{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.prog .nums b{color:var(--ink);font-weight:600}
.due{font-size:12.5px}
.due.over{color:var(--danger);font-weight:600}
.due.soon{color:var(--warn);font-weight:600}
.due.none{color:var(--faint)}
.rowact{display:flex;justify-content:flex-end;gap:6px}
.mini{
  height:26px;padding:0 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);
  font-size:12px;color:var(--muted);
}
.mini:hover{color:var(--ink);border-color:var(--muted)}
.editing{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--warn);
  font-weight:600;
}
.editing i{width:5px;height:5px;border-radius:50%;background:var(--warn);display:inline-block;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.editing i{animation:none}.bar>i{transition:none}}

/* ---------- board ---------- */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.col{flex:0 0 236px;display:flex;flex-direction:column;gap:8px}
.colhead{display:flex;align-items:center;gap:8px;padding:0 2px 2px}
.colhead .num{font-family:Archivo,system-ui;font-variation-settings:"wdth" 70,"wght" 700;font-size:14px;color:var(--sc)}
.colhead .nm{font-size:12.5px;color:var(--body);font-weight:600}
.colhead .ct{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
.colbody{
  display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:var(--r);
  background:var(--sunk);border:1px solid var(--line-soft);min-height:80px;
}
.card{
  text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--sc); border-radius:6px;padding:9px 10px;box-shadow:var(--shadow-1);
}
.card:hover{border-color:var(--muted);border-left-color:var(--sc)}
.card .cn{font-weight:600;color:var(--ink);font-size:13.5px;line-height:1.25}
.card .cm{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:11.5px;color:var(--muted)}
.card .bar{margin-top:8px;height:4px}
.colempty{font-size:12px;color:var(--faint);text-align:center;padding:12px 4px}

/* ---------- activity ---------- */
.feed{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.ev{display:grid;grid-template-columns:26px 1fr auto;gap:11px;align-items:start;padding:10px 14px;border-bottom:1px solid var(--line-soft)}
.ev:last-child{border-bottom:0}
.ev .face{margin:0;width:26px;height:26px;border-width:0;font-size:9.5px}
.ev .txt{font-size:13.5px;color:var(--body)}
.ev .txt b{color:var(--ink);font-weight:600}
.ev .when{font-size:11.5px;color:var(--faint);white-space:nowrap;padding-top:2px}
.daysep{padding:7px 14px;background:var(--surface-2);border-bottom:1px solid var(--line-soft)}

/* ---------- empty ---------- */
.empty{
  border:1px dashed var(--line);border-radius:var(--r);background:var(--surface);
  padding:44px 24px;text-align:center;
}
.empty h2{font-variation-settings:"wdth" 112,"wght" 700;font-size:18px;margin-bottom:6px}
.empty p{color:var(--muted);max-width:44ch;margin:0 auto 16px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,20,18,.42);z-index:50;backdrop-filter:blur(1.5px)}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);z-index:60;
  background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-2);
  display:flex;flex-direction:column;
}
.dhead{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.dhead .grow{flex:1;min-width:0}
.dtitle{
  font-family:Archivo,system-ui;font-variation-settings:"wdth" 110,"wght" 700;font-size:18px;
  color:var(--ink);width:100%;border:0;background:transparent;padding:2px 0;
}
.dtitle:focus{outline:none;border-bottom:1px solid var(--accent)}
.dbody{flex:1;overflow-y:auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:18px}
.fset{display:flex;flex-direction:column;gap:9px}
.fset>.lbl{padding-bottom:1px;border-bottom:1px solid var(--line-soft)}
.frow{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
.frow>label{font-size:12.5px;color:var(--muted)}
.inp{
  width:100%;height:32px;padding:0 9px;border:1px solid var(--line);border-radius:6px;
  background:var(--surface);font-size:13.5px;
}
textarea.inp{height:auto;min-height:74px;padding:8px 9px;resize:vertical;line-height:1.5}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.inp[disabled]{background:var(--sunk);color:var(--muted)}
.skus{display:flex;align-items:center;gap:8px}
.skus .inp{width:78px;text-align:right}
.checks{display:flex;flex-direction:column;gap:2px}
.chk{display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:6px;font-size:13.5px}
.chk:hover{background:var(--surface-2)}
.chk input{width:15px;height:15px;accent-color:var(--accent);flex:none}
.chk.done{color:var(--muted);text-decoration:line-through}
.hist{display:flex;flex-direction:column;gap:0}
.hist .h{display:flex;gap:9px;padding:6px 0;border-bottom:1px dotted var(--line);font-size:12.5px}
.hist .h:last-child{border-bottom:0}
.hist .h .w{color:var(--ink);font-weight:600;flex:none}
.hist .h .t{margin-left:auto;color:var(--faint);font-size:11.5px;white-space:nowrap;flex:none}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line-soft);border-radius:6px;padding:9px 11px}

/* ---------- modal ---------- */
.modal{
  position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px;
  background:rgba(8,20,18,.5);
}
.sheet{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-2);
  width:min(620px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;
}
.shead{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.shead h2{font-variation-settings:"wdth" 112,"wght" 700;font-size:16px;flex:1}
.sbody{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;background:var(--surface-2)}
.paste{width:100%;min-height:150px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.6;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);resize:vertical}
.paste:focus{outline:none;border-color:var(--accent)}
.prev{border:1px solid var(--line);border-radius:6px;overflow:hidden;max-height:200px;overflow-y:auto}
.prev table{width:100%;border-collapse:collapse;font-size:12.5px}
.prev th{text-align:left;padding:6px 10px;background:var(--surface-2);color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;position:sticky;top:0}
.prev td{padding:5px 10px;border-top:1px solid var(--line-soft)}
.teamrow{display:grid;grid-template-columns:28px 1fr 118px;gap:10px;align-items:center}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;
  background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:999px;font-size:13px;
  box-shadow:var(--shadow-2);
}

@media (max-width:720px){
  .topbar{padding:10px 14px;gap:12px}
  .mark h1{font-size:16px}
  .mark .store{display:none}
  .stats,.strip,.toolbar,.banner{margin-left:14px;margin-right:14px}
  main{padding:14px}
  .stat{flex:1 1 46%}
  .drawer{width:100%}
  .frow{grid-template-columns:88px 1fr}
}
</style>

<div class="app">
  <header class="topbar">
    <div class="mark">
      <h1>Brand&nbsp;Upload&nbsp;Desk</h1>
      <span class="store" id="storeName">51East store</span>
    </div>
    <div class="livepill" id="livePill"><i class="livedot"></i><span id="liveTxt">Connecting…</span></div>
    <div class="faces" id="faces"></div>
    <button class="whoami" id="whoBtn">You: <b id="whoName">pick your name</b> ▾</button>
    <button class="iconbtn" id="setBtn" title="Team &amp; settings" aria-label="Team and settings">⚙</button>
  </header>

  <div class="banner" id="banner" hidden></div>
  <section class="stats" id="stats"></section>
  <nav class="strip" id="strip" aria-label="Filter by stage"></nav>

  <div class="toolbar">
    <div class="seg" role="group" aria-label="View">
      <button data-view="table" aria-pressed="true">Pipeline</button>
      <button data-view="board" aria-pressed="false">Board</button>
      <button data-view="feed" aria-pressed="false">Activity</button>
    </div>
    <div class="field"><span class="lbl">Find</span><input id="q" type="search" placeholder="Brand or category…"></div>
    <div class="field"><span class="lbl">Owner</span><select id="fOwner"></select></div>
    <div class="field"><span class="lbl">Sort</span>
      <select id="fSort">
        <option value="stage">Stage order</option>
        <option value="due">Deadline</option>
        <option value="updated">Last update</option>
        <option value="progress">Least complete</option>
        <option value="name">Brand A–Z</option>
      </select>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="exportBtn">Export CSV</button>
    <button class="btn primary" id="addBtn">+ Add brands</button>
  </div>

  <main id="main"></main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Brand detail"></aside>
<div id="modalHost"></div>

<script>
(function(){
"use strict";

/* ============ constants ============ */
var STAGES = [
  {id:"intake",    n:"01", label:"Intake",          hint:"Catalogue and assets received from the brand", v:"--st-intake"},
  {id:"sheet",     n:"02", label:"Sheet prep",      hint:"Excel built, attributes mapped to store fields", v:"--st-sheet"},
  {id:"images",    n:"03", label:"Images",          hint:"Product images cropped, named and linked", v:"--st-images"},
  {id:"ready",     n:"04", label:"Ready to upload", hint:"Sheet validated, waiting for the import window", v:"--st-ready"},
  {id:"uploading", n:"05", label:"Uploading",       hint:"Import running against the store", v:"--st-uploading"},
  {id:"qc",        n:"06", label:"QC review",       hint:"Supervisor checking the live rows", v:"--st-qc"},
  {id:"live",      n:"07", label:"Live",            hint:"Published and signed off", v:"--st-live"},
  {id:"blocked",   n:"—",  label:"Blocked",         hint:"Waiting on the brand or on someone else", v:"--st-blocked"}
];
var STAGE = {}; STAGES.forEach(function(s,i){ STAGE[s.id]=s; s.idx=i; });
var FLOW = ["intake","sheet","images","ready","uploading","qc","live"];
var CHECKS = [
  ["titles","Titles &amp; descriptions"],
  ["prices","Prices &amp; stock levels"],
  ["images","Images attached to every SKU"],
  ["variants","Variants / size &amp; colour options"],
  ["categories","Category mapping"],
  ["seo","SEO fields (slug, meta)"]
];
var PRIOS = [["high","High"],["normal","Normal"],["low","Low"]];
var MEMBER_COLORS = ["#1a76ad","#7a52cc","#a86e14","#a3376f","#25813f","#5f7387"];
var DEFAULT_TEAM = [
  {id:"m1", name:"Supervisor",   role:"supervisor", color:MEMBER_COLORS[0]},
  {id:"m2", name:"Specialist 1", role:"specialist", color:MEMBER_COLORS[1]},
  {id:"m3", name:"Specialist 2", role:"specialist", color:MEMBER_COLORS[2]}
];
var SAMPLES = [
  {name:"Aurora Home",         category:"Home &amp; Living", skuTotal:248, skuDone:96,  stage:"sheet",     assignee:"m2", priority:"normal", due:offset(6)},
  {name:"Nordvik Denim",       category:"Apparel",           skuTotal:96,  skuDone:96,  stage:"images",    assignee:"m3", priority:"high",   due:offset(2)},
  {name:"Casa Verde Ceramics", category:"Kitchen",           skuTotal:61,  skuDone:61,  stage:"ready",     assignee:"m2", priority:"normal", due:offset(4)},
  {name:"Halcyon Audio",       category:"Electronics",       skuTotal:34,  skuDone:34,  stage:"uploading", assignee:"m3", priority:"high",   due:offset(0)},
  {name:"Petal &amp; Press",   category:"Stationery",        skuTotal:180, skuDone:180, stage:"qc",        assignee:"m1", priority:"normal", due:offset(-1)},
  {name:"Marisol Swim",        category:"Apparel",           skuTotal:72,  skuDone:72,  stage:"live",      assignee:"m2", priority:"low",    due:offset(-5)},
  {name:"Foundry Tools",       category:"Hardware",          skuTotal:410, skuDone:118, stage:"blocked",   assignee:"m3", priority:"high",   due:offset(9),
   blockReason:"Waiting on the brand for weights and HS codes — 292 rows cannot be imported without them."}
];
function offset(d){ var x=new Date(); x.setDate(x.getDate()+d); return x.toISOString().slice(0,10); }

/* ============ state ============ */
var db=null, room=null, dl=null;
var state = {
  brands:[], config:null, view:"table", stageFilter:"all", owner:"all",
  sort:"stage", q:"", openId:null, me:null, peers:[], connected:false, ready:false
};
var LS = "bud.identity.v1";

/* ============ tiny helpers ============ */
function $(s){ return document.querySelector(s); }
function esc(v){
  return String(v==null?"":v).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function unesc(v){
  return String(v==null?"":v).replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'");
}
function team(){ return (state.config && state.config.team && state.config.team.length) ? state.config.team : DEFAULT_TEAM; }
function member(id){ var t=team(); for(var i=0;i<t.length;i++){ if(t[i].id===id) return t[i]; } return null; }
function meObj(){ return member(state.me); }
function meName(){ var m=meObj(); return m?m.name:"Someone"; }
function initials(n){
  var p=String(n||"?").trim().split(/\s+/);
  return ((p[0]||"?")[0] + (p[1]?p[1][0]:(p[0]||"?")[1]||"")).toUpperCase();
}
function toast(msg){
  var old=$(".toast"); if(old) old.remove();
  var t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.remove(); }, 2600);
}
function pct(b){ var tot=Number(b.skuTotal)||0; if(!tot) return 0; return Math.max(0,Math.min(100,Math.round((Number(b.skuDone)||0)/tot*100))); }
function today(){ return new Date().toISOString().slice(0,10); }
function dueClass(d,stage){
  if(!d) return "none";
  if(stage==="live") return "";
  var t=today();
  if(d<t) return "over";
  var soon=new Date(); soon.setDate(soon.getDate()+3);
  return d<=soon.toISOString().slice(0,10) ? "soon" : "";
}
function fmtDue(d){
  if(!d) return "—";
  var p=d.split("-"); if(p.length!==3) return d;
  var mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return Number(p[2]) + " " + mo[Number(p[1])-1];
}
function ago(t){
  if(!t) return "";
  var s=Math.max(0,Math.floor((Date.now()-t)/1000));
  if(s<60) return "just now";
  if(s<3600) return Math.floor(s/60)+" min ago";
  if(s<86400) return Math.floor(s/3600)+" h ago";
  if(s<604800) return Math.floor(s/86400)+" d ago";
  return new Date(t).toISOString().slice(0,10);
}
function clockOf(t){ var d=new Date(t); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function dayOf(t){
  var d=new Date(t), n=new Date();
  var same=function(a,b){ return a.toDateString()===b.toDateString(); };
  if(same(d,n)) return "Today";
  var y=new Date(n); y.setDate(y.getDate()-1);
  if(same(d,y)) return "Yesterday";
  return d.toDateString().slice(0,10);
}
function codeFor(name){
  var w=String(name).toUpperCase().replace(/[^A-Z0-9 ]/g,"").split(/\s+/).filter(Boolean);
  var c = w.length>1 ? (w[0].slice(0,2)+w[1].slice(0,2)) : (w[0]||"BRND").slice(0,4);
  return c.padEnd(4,"X");
}

/* ============ sample vs live ============ */
function inSample(){
  return !state.brands.length && !(state.config && state.config.started);
}
function rows(){
  if(inSample()){
    return SAMPLES.map(function(s,i){
      var b=Object.assign({id:"sample"+i, _sample:true, checks:{}, history:[], notes:"", sheetLink:"",
        code:codeFor(unesc(s.name)), updatedAt:Date.now()-(i+1)*5400000, updatedBy:s.assignee}, s);
      return b;
    });
  }
  return state.brands;
}
function visible(){
  var list = rows().slice();
  if(state.stageFilter!=="all") list=list.filter(function(b){ return b.stage===state.stageFilter; });
  if(state.owner!=="all") list=list.filter(function(b){ return (b.assignee||"")===(state.owner==="none"?"":state.owner); });
  var q=state.q.trim().toLowerCase();
  if(q) list=list.filter(function(b){
    return (unesc(b.name)+" "+unesc(b.category||"")+" "+(b.code||"")).toLowerCase().indexOf(q)>=0;
  });
  var s=state.sort;
  list.sort(function(a,b){
    if(s==="name") return unesc(a.name).localeCompare(unesc(b.name));
    if(s==="updated") return (b.updatedAt||0)-(a.updatedAt||0);
    if(s==="progress") return pct(a)-pct(b);
    if(s==="due"){
      var ad=a.due||"9999", bd=b.due||"9999";
      return ad===bd ? unesc(a.name).localeCompare(unesc(b.name)) : (ad<bd?-1:1);
    }
    var d=(STAGE[a.stage]?STAGE[a.stage].idx:9)-(STAGE[b.stage]?STAGE[b.stage].idx:9);
    return d || (a.due||"9999").localeCompare(b.due||"9999");
  });
  return list;
}

/* ============ writes ============ */
function log(b, text){
  return {t:Date.now(), w:state.me||"", who:meName(), text:text, bid:b.id, bn:unesc(b.name)};
}
function patch(id, changes, logText){
  var b=null, all=state.brands;
  for(var i=0;i<all.length;i++){ if(all[i].id===id){ b=all[i]; break; } }
  if(!b || !db) return Promise.resolve();
  var body=Object.assign({}, changes, {updatedAt:Date.now(), updatedBy:state.me||""});
  if(logText) body.history=[log(b,logText)].concat(b.history||[]).slice(0,25);
  return db.doc("brands/"+id).update(body)["catch"](function(e){ dbFail(e,"save that change"); });
}
function dbFail(e, what){
  var c=(e&&e.code)||"unavailable";
  if(c==="quota_exceeded") toast("The tracker is full — delete some finished brands first.");
  else if(c==="resource_exhausted") toast("Too many changes at once — give it a second and try again.");
  else if(c==="revoked"||c==="not_granted") toast("You no longer have access to this tracker.");
  else toast("Could not "+what+". Try again.");
}

/* ============ presence ============ */
function pushPresence(){
  if(!room) return;
  room.presence({ who: state.me||null, name: state.me?meName():null, viewing: state.openId||null })
    ["catch"](function(){});
}
function editorsOf(id){
  return state.peers.filter(function(p){
    return !p.isMe && p.presence && p.presence.viewing===id;
  });
}

/* ============ render: top ============ */
function renderTop(){
  $("#whoName").textContent = state.me ? meName() : "pick your name";
  if(state.config && state.config.store) $("#storeName").textContent = state.config.store;

  var pill=$("#livePill"), txt=$("#liveTxt");
  var others = state.peers.filter(function(p){ return !p.isMe && p.kind==="viewer"; }).length;
  if(state.connected){
    pill.classList.add("on");
    txt.textContent = others===0 ? "Live · only you" : ("Live · "+(others+1)+" here now");
  } else {
    pill.classList.remove("on");
    txt.textContent = room===null ? "Offline" : "Reconnecting…";
  }

  var seen={}, faces=[];
  state.peers.forEach(function(p){
    if(p.kind!=="viewer") return;
    var w=p.presence&&p.presence.who, m=w?member(w):null;
    var key=m?("m:"+m.id):("p:"+p.peer);
    if(seen[key]) return; seen[key]=1;
    faces.push(m
      ? '<span class="face" style="background:'+esc(m.color||"#5f7387")+'" title="'+esc(m.name)+(p.isMe?" (you)":"")+'">'+esc(initials(m.name))+'</span>'
      : '<span class="face ghost" title="Someone who has not picked a name">?</span>');
  });
  $("#faces").innerHTML = faces.join("");
}

/* ============ render: stats ============ */
function renderStats(){
  var list=rows();
  var byStage={}; list.forEach(function(b){ byStage[b.stage]=(byStage[b.stage]||0)+1; });
  var totalSku=0, doneSku=0, live=0, blocked=0, late=0;
  var t=today();
  list.forEach(function(b){
    totalSku += Number(b.skuTotal)||0;
    doneSku  += Math.min(Number(b.skuDone)||0, Number(b.skuTotal)||0);
    if(b.stage==="live") live++;
    if(b.stage==="blocked") blocked++;
    if(b.due && b.due<t && b.stage!=="live") late++;
  });
  var p = totalSku ? Math.round(doneSku/totalSku*100) : 0;
  var wip = list.length - live - blocked;

  $("#stats").innerHTML =
    tile("Brands in the pipeline", list.length+' <small>total</small>', "") +
    tile("SKU rows prepared", '<span class="mono">'+doneSku.toLocaleString()+'</span> <small>of '+totalSku.toLocaleString()+'</small>', "", '<div class="bar"><i style="width:'+p+'%"></i></div>') +
    tile("Working now", wip+' <small>brands</small>', "") +
    tile("Blocked", blocked, blocked?"alarm":"") +
    tile("Past deadline", late, late?"warnish":"") +
    tile("Live on the store", live, "");
}
function tile(k,v,cls,extra){
  return '<div class="stat '+(cls||"")+'"><div class="v">'+v+'</div><div class="k lbl">'+k+'</div>'+(extra||"")+'</div>';
}

/* ============ render: stage strip ============ */
function renderStrip(){
  var list=rows(), counts={};
  list.forEach(function(b){ counts[b.stage]=(counts[b.stage]||0)+1; });
  var html = '<button class="stagechip" data-stage="all" aria-pressed="'+(state.stageFilter==="all")+'" style="--sc:var(--muted)">'+
    '<i class="swatch"></i><span class="num">ALL</span><span class="nm">Everything</span><span class="ct">'+list.length+'</span></button>';
  html += STAGES.map(function(s){
    return '<button class="stagechip" data-stage="'+s.id+'" aria-pressed="'+(state.stageFilter===s.id)+'" title="'+esc(s.hint)+'" style="--sc:var('+s.v+')">'+
      '<i class="swatch"></i><span class="num">'+s.n+'</span><span class="nm">'+esc(s.label)+'</span>'+
      '<span class="ct">'+(counts[s.id]||0)+'</span></button>';
  }).join("");
  $("#strip").innerHTML = html;
}

/* ============ render: banner ============ */
function renderBanner(){
  var el=$("#banner");
  if(inSample()){
    el.hidden=false;
    el.innerHTML='<span class="grow"><b>These seven brands are examples</b> so you can see how the desk works. Nothing here is saved.</span>'+
      '<button class="btn" id="seedBtn">Keep them as practice rows</button>'+
      '<button class="btn primary" id="startBtn">Clear and add our brands</button>';
    return;
  }
  if(!state.me){
    el.hidden=false;
    el.innerHTML='<span class="grow"><b>Tell the desk who you are</b> so your edits are signed and the others can see you here.</span>'+
      '<button class="btn primary" id="pickBtn">Pick your name</button>';
    return;
  }
  if(!db){
    el.hidden=false;
    el.innerHTML='<span class="grow"><b>Live sync is not available in this view.</b> Open the artifact link in Claude to share the tracker with your team.</span>';
    return;
  }
  el.hidden=true; el.innerHTML="";
}

/* ============ render: table ============ */
function renderTable(){
  var list=visible();
  if(!list.length) return emptyState();
  var head='<div class="row head"><div></div><div class="lbl">Brand</div><div class="lbl">Stage</div>'+
    '<div class="lbl">Owner</div><div class="lbl">SKU rows prepared</div><div class="lbl">Deadline</div><div class="lbl" style="text-align:right">Move</div></div>';
  var body=list.map(function(b){
    var s=STAGE[b.stage]||STAGE.intake, p=pct(b), ed=editorsOf(b.id);
    var m=member(b.assignee);
    var nx=nextStage(b.stage);
    return '<button class="rw row" data-id="'+esc(b.id)+'" aria-current="'+(state.openId===b.id)+'" style="--sc:var('+s.v+')">'+
      '<div class="stripe"></div>'+
      '<div><div class="bname">'+esc(unesc(b.name))+(Number(b.priority==="high")?' <span style="color:var(--danger)" title="High priority">▲</span>':'')+'</div>'+
        '<div class="bmeta"><span class="mono code">'+esc(b.code||"")+'</span>'+
        (b.category?'<span>'+esc(unesc(b.category))+'</span>':'')+
        (ed.length?'<span class="editing"><i></i>'+esc(nameOfPeer(ed[0]))+' has it open</span>':'')+'</div></div>'+
      '<div><span class="pill" style="--sc:var('+s.v+')"><i class="dot"></i>'+esc(s.label)+'</span></div>'+
      '<div>'+(m
        ? '<div class="owner"><span class="face" style="background:'+esc(m.color||"#5f7387")+'">'+esc(initials(m.name))+'</span><span>'+esc(m.name)+'</span></div>'
        : '<div class="owner none">Unassigned</div>')+'</div>'+
      '<div class="prog"><div class="nums"><span class="mono"><b>'+(Number(b.skuDone)||0).toLocaleString()+'</b> / '+(Number(b.skuTotal)||0).toLocaleString()+'</span><span class="mono">'+p+'%</span></div>'+
        '<div class="bar"><i style="width:'+p+'%;background:var('+s.v+')"></i></div></div>'+
      '<div class="due '+dueClass(b.due,b.stage)+'">'+esc(fmtDue(b.due))+'</div>'+
      '<div class="rowact">'+(nx&&!b._sample?'<span class="mini" data-adv="'+esc(b.id)+'" title="Move to '+esc(STAGE[nx].label)+'">'+esc(STAGE[nx].n)+' →</span>':'')+'</div>'+
    '</button>';
  }).join("");
  $("#main").innerHTML='<div class="tablewrap"><div class="grid">'+head+body+'</div></div>';
}
function nameOfPeer(p){
  var w=p.presence&&p.presence.who, m=w?member(w):null;
  return m?m.name:"Someone";
}
function nextStage(cur){
  if(cur==="blocked") return "intake";
  var i=FLOW.indexOf(cur);
  return (i>=0 && i<FLOW.length-1) ? FLOW[i+1] : null;
}

/* ============ render: board ============ */
function renderBoard(){
  var list=visible();
  var cols=STAGES.map(function(s){
    var mine=list.filter(function(b){ return b.stage===s.id; });
    var cards=mine.map(function(b){
      var m=member(b.assignee), p=pct(b);
      return '<button class="card" data-id="'+esc(b.id)+'" style="--sc:var('+s.v+')">'+
        '<div class="cn">'+esc(unesc(b.name))+'</div>'+
        '<div class="cm">'+(m?'<span class="face" style="background:'+esc(m.color||"#5f7387")+';width:19px;height:19px;font-size:8.5px;border-width:0;margin:0">'+esc(initials(m.name))+'</span>':'<span>Unassigned</span>')+
        '<span class="mono">'+(Number(b.skuTotal)||0).toLocaleString()+' SKUs</span>'+
        (b.due?'<span class="due '+dueClass(b.due,b.stage)+'" style="margin-left:auto">'+esc(fmtDue(b.due))+'</span>':'')+'</div>'+
        '<div class="bar"><i style="width:'+p+'%;background:var('+s.v+')"></i></div>'+
      '</button>';
    }).join("");
    return '<div class="col" style="--sc:var('+s.v+')"><div class="colhead"><span class="num">'+s.n+'</span>'+
      '<span class="nm">'+esc(s.label)+'</span><span class="ct">'+mine.length+'</span></div>'+
      '<div class="colbody">'+(cards||'<div class="colempty">Nothing here</div>')+'</div></div>';
  }).join("");
  $("#main").innerHTML='<div class="board">'+cols+'</div>';
}

/* ============ render: activity ============ */
function renderFeed(){
  var events=[];
  rows().forEach(function(b){ (b.history||[]).forEach(function(h){ events.push(h); }); });
  events.sort(function(a,b){ return (b.t||0)-(a.t||0); });
  events=events.slice(0,120);
  if(!events.length){
    $("#main").innerHTML='<div class="empty"><h2>No changes yet</h2><p>Every stage move, reassignment and SKU count lands here the moment someone makes it, so nobody has to ask where a brand stands.</p></div>';
    return;
  }
  var out="", lastDay="";
  events.forEach(function(h){
    var d=dayOf(h.t);
    if(d!==lastDay){ out+='<div class="daysep lbl">'+esc(d)+'</div>'; lastDay=d; }
    var m=member(h.w);
    out+='<div class="ev"><span class="face" style="background:'+esc(m?(m.color||"#5f7387"):"#5f7387")+'">'+esc(initials(h.who||"?"))+'</span>'+
      '<div class="txt"><b>'+esc(h.who||"Someone")+'</b> '+esc(h.text)+' — <b>'+esc(h.bn||"")+'</b></div>'+
      '<div class="when mono" title="'+esc(new Date(h.t).toString())+'">'+esc(clockOf(h.t))+'</div></div>';
  });
  $("#main").innerHTML='<div class="feed">'+out+'</div>';
}

/* ============ empty ============ */
function emptyState(){
  var filtered = rows().length>0;
  $("#main").innerHTML='<div class="empty"><h2>'+(filtered?"Nothing matches those filters":"No brands on the desk yet")+'</h2>'+
    '<p>'+(filtered
      ? "Clear the search or pick a different stage to see the rest of the pipeline."
      : "Paste a column of brand names straight out of your Excel sheet and the desk will build a row for each one.")+'</p>'+
    (filtered
      ? '<button class="btn" id="clearFilters">Clear filters</button>'
      : '<button class="btn primary" id="addBtn2">+ Add brands</button>')+'</div>';
}

/* ============ render root ============ */
function render(){
  renderTop(); renderBanner(); renderStats(); renderStrip();
  if(state.view==="table") renderTable();
  else if(state.view==="board") renderBoard();
  else renderFeed();
  if(state.openId) renderDrawer();
  syncOwnerFilter();
}
function syncOwnerFilter(){
  var sel=$("#fOwner");
  var want = '<option value="all">Everyone</option>' +
    team().map(function(m){ return '<option value="'+esc(m.id)+'">'+esc(m.name)+'</option>'; }).join("") +
    '<option value="none">Unassigned</option>';
  if(sel.getAttribute("data-sig")!==want){ sel.innerHTML=want; sel.setAttribute("data-sig",want); }
  sel.value=state.owner;
}

/* ============ drawer ============ */
function openBrand(id){
  state.openId=id; pushPresence();
  $("#scrim").hidden=false; $("#drawer").hidden=false;
  $("#drawer").removeAttribute("data-brand");
  render();
  var t=$(".dtitle"); if(t && !t.disabled) t.focus();
}
function closeBrand(){
  state.openId=null; pushPresence();
  $("#scrim").hidden=true; $("#drawer").hidden=true; $("#drawer").innerHTML=""; $("#drawer").removeAttribute("data-brand");
  render();
}
function currentBrand(){
  var list=rows();
  for(var i=0;i<list.length;i++){ if(list[i].id===state.openId) return list[i]; }
  return null;
}
function typingInDrawer(){
  var a=document.activeElement, host=$("#drawer");
  if(!a || !host || !host.contains(a)) return false;
  var tag=a.tagName;
  return tag==="TEXTAREA" || (tag==="INPUT" && /^(text|number|date|search|url|$)/.test(a.type||""));
}
function renderDrawer(){
  var b=currentBrand();
  if(!b){ closeBrand(); return; }
  var host=$("#drawer");
  if(host.getAttribute("data-brand")===b.id && typingInDrawer()) return;
  host.setAttribute("data-brand", b.id);
  var ro = !!b._sample || !db || !state.me;

document.addEventListener("change", function(e){
  var t=e.target;
  if(!state.openId) return;
  var b=currentBrand(); if(!b || b._sample) return;
  var id=b.id;
  if(t.id==="dStage"){
    var to=t.value;
    patch(id,{stage:to}, "moved it to "+STAGE[to].label);
  } else if(t.id==="dOwner"){
    var m=member(t.value);
    patch(id,{assignee:t.value}, m?("handed it to "+m.name):"unassigned it");
  } else if(t.id==="dPrio"){
    patch(id,{priority:t.value}, "set priority to "+t.value);
  } else if(t.id==="dDue"){
    patch(id,{due:t.value}, t.value?("set the deadline to "+fmtDue(t.value)):"cleared the deadline");
  } else if(t.id==="dDone" || t.id==="dTotal"){
    var done=Math.max(0,Number($("#dDone").value)||0), tot=Math.max(0,Number($("#dTotal").value)||0);
    if(tot && done>tot) done=tot;
    patch(id,{skuDone:done, skuTotal:tot}, "logged "+done.toLocaleString()+" of "+tot.toLocaleString()+" SKU rows");
  } else if(t.hasAttribute && t.hasAttribute("data-check")){
    var key=t.getAttribute("data-check");
    var ch=Object.assign({}, b.checks||{}); ch[key]=t.checked;
    var nm=""; CHECKS.forEach(function(c){ if(c[0]===key) nm=unesc(c[1]); });
    patch(id,{checks:ch}, (t.checked?"signed off ":"reopened ")+nm.toLowerCase());
  }
}, false);

document.addEventListener("blur", function(e){
  var t=e.target;
  if(!state.openId) return;
  var b=currentBrand(); if(!b || b._sample) return;
  if(t.id==="dName" && t.value.trim() && t.value.trim()!==unesc(b.name)){
    patch(b.id,{name:t.value.trim(), code:codeFor(t.value.trim())}, "renamed it from "+unesc(b.name));
  } else if(t.id==="dCat" && t.value!==unesc(b.category||"")){
    patch(b.id,{category:t.value.trim()}, "set the category to "+(t.value.trim()||"none"));
  } else if(t.id==="dLink" && t.value!==(b.sheetLink||"")){
    patch(b.id,{sheetLink:t.value.trim()}, t.value.trim()?"attached the Excel sheet":"removed the sheet link");
  } else if(t.id==="dNotes" && t.value!==unesc(b.notes||"")){
    patch(b.id,{notes:t.value}, "updated the notes");
  } else if(t.id==="dBlock" && t.value!==unesc(b.blockReason||"")){

}, true);

function newBrand(o){
  var name=String(o.name||"").trim();
  return {
    name:name, code:codeFor(name), category:String(o.category||"").trim(),
    skuTotal:Number(o.skuTotal)||0, skuDone:Number(o.skuDone)||0,
    stage:o.stage||"intake", assignee:o.assignee||"", priority:o.priority||"normal",
    due:o.due||"", sheetLink:"", notes:"", blockReason:o.blockReason||"",
    checks:{}, createdAt:Date.now(), updatedAt:Date.now(), updatedBy:state.me||"",
    history:[{t:Date.now(), w:state.me||"", who:meName(), text:"added it to the desk", bn:name}]
  };
}
function createMany(items){
  if(!db) { toast("Live sync is not available in this view."); return Promise.resolve(); }
  var chain=Promise.resolve(), made=0;
  items.forEach(function(o){
    chain=chain.then(function(){
      return db.collection("brands").add(newBrand(o)).then(function(){ made++; })["catch"](function(e){ dbFail(e,"add "+o.name); });
    });
  });
  return chain.then(function(){
    return ensureConfig({started:true}).then(function(){
      toast(made===1 ? "Added 1 brand." : ("Added "+made+" brands."));
    });
  });
}
function seed(items){
  createMany(items.map(function(s){ return Object.assign({}, s, {name:unesc(s.name), category:unesc(s.category)}); }));
}
function startEmpty(){ ensureConfig({started:true}).then(function(){ toast("Desk cleared. Add your brands."); addModal(); }); }
function ensureConfig(extra){
  if(!db) return Promise.resolve();
  var body=Object.assign({team:team(), store:(state.config&&state.config.store)||"51East store", started:true, updatedAt:Date.now()}, extra||{});
  return db.doc("meta/config").set(body)["catch"](function(e){ dbFail(e,"save the settings"); });
}
function removeBrand(){
  var b=currentBrand(); if(!b||!db) return;
  if(!window.confirm('Remove "'+unesc(b.name)+'" from the desk? Its history goes with it.')) return;
  var id=b.id;
  closeBrand();
  db.doc("brands/"+id)["delete"]().then(function(){ toast("Removed."); })["catch"](function(e){ dbFail(e,"remove that brand"); });
}

    m.querySelector("#doAdd").disabled = !items.length;

    m.querySelector("#pPreview").innerHTML = items.length
      ? '<div class="prev"><table><thead><tr><th>Brand</th><th>SKUs</th><th>Category</th><th>Deadline</th></tr></thead><tbody>'+
        items.slice(0,50).map(function(o){
          return '<tr><td>'+esc(o.name)+'</td><td class="mono">'+(o.skuTotal||"—")+'</td><td>'+esc(o.category||"—")+'</td><td>'+esc(o.due||"—")+'</td></tr>';

function parsePaste(text){
  var out=[];
  String(text||"").split(/\r?\n/).forEach(function(line){
    if(!line.trim()) return;
    var cells = line.indexOf("\t")>=0 ? line.split("\t") : (line.indexOf(",")>=0 ? splitCsv(line) : [line]);
    var name=(cells[0]||"").trim().replace(/^"|"$/g,"");
    if(!name) return;
    var o={name:name, skuTotal:0, category:"", due:""};
    for(var i=1;i<cells.length;i++){
      var c=(cells[i]||"").trim().replace(/^"|"$/g,"");
      if(!c) continue;
      if(!o.skuTotal && /^\d[\d,\s]*$/.test(c)) o.skuTotal=Number(c.replace(/[,\s]/g,""));
      else if(!o.due && /^\d{4}-\d{2}-\d{2}$/.test(c)) o.due=c;
      else if(!o.category) o.category=c;
    }
    out.push(o);
  });
  return out;
}
function splitCsv(line){
  var out=[], cur="", q=false;
  for(var i=0;i<line.length;i++){
    var ch=line[i];
    if(ch==='"'){ if(q && line[i+1]==='"'){ cur+='"'; i++; } else q=!q; }
    else if(ch==="," && !q){ out.push(cur); cur=""; }
    else cur+=ch;
  }
  out.push(cur); return out;
}

/* ============ export ============ */
function exportCsv(){
  var list=visible();
  if(!list.length){ toast("Nothing to export with these filters."); return; }
  var head=["Brand","Code","Category","Stage","Owner","SKU rows done","SKU rows total","% complete","Priority","Deadline","QC signed off","Blocked on","Notes","Last update","Updated by"];
  var lines=[head.join(",")];
  list.forEach(function(b){
    var m=member(b.assignee), u=member(b.updatedBy);
    var qc=CHECKS.filter(function(c){ return (b.checks||{})[c[0]]; }).length+"/"+CHECKS.length;
    lines.push([
      unesc(b.name), b.code||"", unesc(b.category||""), (STAGE[b.stage]||{}).label||b.stage,
      m?m.name:"Unassigned", Number(b.skuDone)||0, Number(b.skuTotal)||0, pct(b)+"%",
      b.priority||"normal", b.due||"", qc, unesc(b.blockReason||""), unesc(b.notes||""),
      b.updatedAt?new Date(b.updatedAt).toISOString().slice(0,16).replace("T"," "):"", u?u.name:""
    ].map(cell).join(","));
  });
  var csv="﻿"+lines.join("\r\n");
  var fname="brand-uploads-"+today()+".csv";
  if(!dl){ toast("Saving files is not available in this view."); return; }
  dl.save({filename:fname, data:csv}).then(function(){ toast("Saved "+fname+"."); })["catch"](function(e){
    var c=(e&&e.code)||"";
    if(c==="declined") return;
    toast(c==="rate_limited" ? "One save at a time — try again in a moment." : "Could not save the file here.");
  });
}
function cell(v){
  var s=String(v==null?"":v);
  return /[",\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
